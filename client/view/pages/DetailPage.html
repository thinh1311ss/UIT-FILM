<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UIT FILM</title>
    <link rel="icon" type="image/svg+xml" href="../../public/assets/image/TabLogo.svg">
    <link rel="preload" href="../../vendor/webfonts/fa-brands-400.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="../../vendor/webfonts/fa-solid-900.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="../../vendor/css/boxicons.min.css">
    <link rel="stylesheet" href="../../vendor/css/fontawesome.min.css">
    <link rel="stylesheet" href="../../Style/HeaderAndFooter.min.css">
    <link rel="stylesheet" href="../../Style/MovieDetail.min.css">
    <link rel="stylesheet" href="../../Style/MovieCard.min.css">
    <link rel="stylesheet" href="../../Style/SearchBar.min.css">
    <link rel="stylesheet" href="../../Style/Trailer.min.css">
  </head>
  <body>
  <!-- start header -->
    <div id="header"></div>

    <script type="module">
      import { headerjs } from "../../js/Header.min.js";
      import { searchBar } from "../../js/SearchBar.min.js";

      fetch("../components/Header.html")
        .then((res) => res.text())
        .then((html) => {
          document.getElementById("header").innerHTML = html;
          headerjs();
          return fetch("../components/SearchBar.html");
        })
        .then((res) => res.text())
        .then((searchHTML) => {
          document.querySelector(".search-box").innerHTML = searchHTML;
          searchBar();
        })
        .catch((error) => console.error("Fetch header/search failed:", error));
    </script>

    <!-- end header -->

    <!-- start-movie-banner -->
    <section class="movie-banner">
      <div class="movie-banner__container">
        <div class="movie-banner__wrap">
          <div class="movie-banner__background"></div>
          <div class="movie-banner__content">
            <div class="movie-banner__poster">
              <img
                alt=""
                loading="lazy"
                src="https://placehold.co/500x750/1a1a2e/0891b2?text=No+Poster"
              >
            </div>
            <div class="movie-banner__info">
              <div class="movie-banner__title">
                <h3>Steve</h3>
              </div>
              <div class="movie-banner__meta">
                <div class="movie-banner__rating">
                  <p>IMDb <span>6.6</span></p>
                </div>
                <div class="movie-banner__age">
                  <span><strong>T18</strong></span>
                </div>
              </div>
              <div class="movie-banner__genres">
                <span>Chính kịch</span>
                <span>Hài</span>
              </div>
              <div class="movie-banner__actions">
                <a
                  id="trailer-btn"
                  class="movie-banner__button movie-banner__button--play"
                  href="#"
                >
                  <i class="fa-solid fa-play"></i>
                  <span><strong>Trailer</strong></span>
                </a>
                <a
                  class="movie-banner__button movie-banner__button--like"
                  href="#"
                >
                  <svg
                    width="17"
                    height="17"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                  >
                    <path
                      d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"
                    />
                  </svg>
                </a>
              </div>
              <div class="movie-banner__overview">
                <span data-i18n="detail.intro">Giới thiệu:</span><br>
                Đang tải thông tin...
              </div>
              <div class="movie-banner__director">
                <p>
                  <span data-i18n="detail.director">Đạo diễn:</span>
                  <span id="director-name">Đang cập nhật</span>
                </p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
    <!-- end-movie-banner -->

    <section class="movie-tabs-section">
      <div class="movie-tabs">
        <button
          class="movie-tabs__item movie-tabs__item--active"
          data-tab="actors"
        >
          Diễn viên
        </button>
        <button class="movie-tabs__item" data-tab="info">Thông tin</button>
        <button class="movie-tabs__item" data-tab="episodes">Tập phim</button>
        <button class="movie-tabs__item" data-tab="recommend">Đề xuất</button>
        <button class="movie-tabs__item" data-tab="comments">Đánh giá</button>
      </div>

      <!-- TAB 1: Cast -->
      <div class="movie-tabs__content movie-tabs__content--active" id="actors">
        <div class="tab-panel tab-panel--actors">
          <h3 data-i18n="detail.section.actors">Diễn viên</h3>
          <div class="actors-grid circle-actor"></div>
          <a class="tab-panel__view-more" data-i18n="detail.viewMore">Xem thêm ⮟</a>
        </div>
      </div>

      <!-- TAB 2: Information -->
      <div class="movie-tabs__content" id="info">
        <div class="tab-panel tab-panel--info">
          <h3 data-i18n="detail.infoTitle">Thông tin phim</h3>
        </div>
      </div>

      <!-- TAB 3: Episodes -->
      <div class="movie-tabs__content" id="episodes">
        <div class="tab-panel tab-panel--episodes">
          <h3 data-i18n="detail.episodes">Danh sách tập</h3>
        </div>
      </div>

      <!-- TAB 4: Comments -->
      <div class="movie-tabs__content" id="comments">
        <div class="tab-panel tab-panel--comments">
          <h3 data-i18n="detail.section.comments">Đánh giá của khán giả</h3>

          <div class="comments-stats">
            <div class="comments-stats__item">
              <span data-i18n="detail.avgRating">Đánh giá trung bình:</span>
              <span id="avg-rating">0</span>/5
            </div>
            <div class="comments-stats__item">
              <span data-i18n="detail.totalComments">Tổng số đánh giá: </span
              ><span id="total-comments">0</span>
            </div>
          </div>

          <div class="comment-form">
            <div class="comment-form__rating">
              <label data-i18n="detail.yourRating">Đánh giá của bạn:</label>
              <div class="star-rating" id="star-rating">
                <i class="fas fa-star" data-rating="1"></i>
                <i class="fas fa-star" data-rating="2"></i>
                <i class="fas fa-star" data-rating="3"></i>
                <i class="fas fa-star" data-rating="4"></i>
                <i class="fas fa-star" data-rating="5"></i>
              </div>
            </div>
            <textarea
              id="comment-text"
              class="comment-form__textarea"
              placeholder="Chia sẻ cảm nhận của bạn về bộ phim..."
              data-i18n-placeholder="detail.commentPlaceholder"
            ></textarea>
            <button id="submit-comment" class="comment-form__submit" data-i18n="detail.submit">
              Gửi đánh giá
            </button>
          </div>

          <div class="comments-list" id="comments-list">
            <div class="comments-list__empty" data-i18n="detail.noComments">
              Chưa có đánh giá nào. Hãy là người đầu tiên!
            </div>
          </div>
        </div>
      </div>

      <!-- TAB 5: Recommendations -->
      <div class="movie-tabs__content" id="recommend">
        <div class="tab-panel tab-panel--recommend">
          <h3 data-i18n="detail.section.recommend">Đề xuất</h3>
          <div
            id="recommendations"
            class="recommendations-grid"
            data-i18n-aria-label="detail.recommendList"
          ></div>
        </div>
      </div>
    </section>

    <!-- Trailer Modal -->
    <div id="trailer-modal" class="trailer-modal">
      <div class="trailer-modal__content">
        <span id="close-trailer" class="trailer-modal__close">×</span>
        <div id="trailer-container">
          <iframe
            id="trailer-frame"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
            allowfullscreen
          ></iframe>
        </div>
      </div>
    </div>

    <!-- start footer -->
    <div id="footer"></div>

    <script type="module">
      fetch("../components/Footer.html")
        .then((res) => res.text())
        .then((html) => {
          document.getElementById("footer").innerHTML = html;
        })
        .catch((error) => {
          console.error("Fetch footer failed:", error);
        });
    </script>
    <!-- end footer -->

    <script type="module" src="../../js/DetailPage.min.js"></script>
    <script type="module" src="../../js/Trailer.min.js"></script>
    <script type="module" src="../../js/Comment.min.js"></script>
  </body>
</html>
